<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clothing Shop</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Header with logo and navigation similar to Myntra -->
  <header>
    <div class="logo">MyStyle</div>
    <nav>
      <a href="#">Home</a>
      <a href="#">Men</a>
      <a href="#">Women</a>
      <a href="#">Kids</a>
      <a href="#">Brands</a>
      <a href="#">Sale</a>
    </nav>
  </header>

  <!-- Hero banner -->
  <section class="hero">
    <img src="https://via.placeholder.com/1200x400?text=Season+Sale" alt="Season Sale" class="hero-img">
    <div class="hero-text">
      <h2>Season Sale 2026</h2>
      <p>Up to 50% off on selected styles.</p>
    </div>
  </section>

  <!-- Product grid (example items) -->
  <section class="products">
    <div class="product">
      <img src="https://via.placeholder.com/200?text=Shirt" alt="Shirt">
      <h3>Casual Shirt</h3>
      <p>$29.99</p>
    </div>
    <div class="product">
      <img src="https://via.placeholder.com/200?text=Jeans" alt="Jeans">
      <h3>Slim Fit Jeans</h3>
      <p>$49.99</p>
    </div>
    <div class="product">
      <img src="https://via.placeholder.com/200?text=Jacket" alt="Jacket">
      <h3>Denim Jacket</h3>
      <p>$89.99</p>
    </div>
    <div class="product">
      <img src="https://via.placeholder.com/200?text=Dress" alt="Dress">
      <h3>Summer Dress</h3>
      <p>$59.99</p>
    </div>
    <div class="product">
      <img src="https://via.placeholder.com/200?text=Sneakers" alt="Sneakers">
      <h3>White Sneakers</h3>
      <p>$74.99</p>
    </div>
    <div class="product">
      <img src="https://via.placeholder.com/200?text=Hat" alt="Hat">
      <h3>Baseball Cap</h3>
      <p>$19.99</p>
    </div>
  </section>

  <footer>
    <p>&copy; 2026 MyStyle. All rights reserved.</p>
  </footer>
</body>
</html>
